<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABEJI 画像承認</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#222}main{max-width:1000px;margin:auto;padding:20px}header{background:#fff;padding:20px;border-radius:12px;margin-bottom:16px}h1{font-size:1.5rem}section{margin:24px 0}h2{font-size:1.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{background:#fff;border:2px solid #ddd;border-radius:12px;overflow:hidden}.card.selected{border-color:#156f55}.card img{width:100%;height:240px;object-fit:contain;background:#eee}.body{padding:12px;overflow-wrap:anywhere;font-size:14px}.body p{margin:7px 0}label{display:block;margin:12px 0;font-weight:600}button{border:0;background:#176b54;color:white;border-radius:9px;padding:12px 18px;font-size:16px;cursor:pointer}button:disabled{background:#999}input[type=file]{max-width:100%}.note{color:#555;font-size:14px}.warn{color:#9b3e15}a{color:#176b54}#status{font-weight:600}</style></head><body><main><header><h1>TABEJI 画像選択・承認</h1><p>GitHub Actionsで生成した <code>commons_candidates.json</code> を読み込んでください。施設ごとに1枚だけ選べます。選択しても画像は公開・登録されません。</p><input id="file" type="file" accept=".json,application/json"><p id="status" aria-live="polite">JSONファイルを選択してください。</p><p class="note">候補写真の施設一致、構図、撮影者表示、ライセンス、改変時の条件はCommonsの元ページで確認してください。画像はこの画面で外部へ送信しません。</p></header><div id="results"></div><section><label><input type="checkbox" id="confirm"> 選択した画像について、元ページで施設一致とライセンス条件を確認しました</label><button id="export" disabled>承認JSONを保存</button><p class="note">iPadでは保存時にダウンロード先を選ぶ場合があります。保存されたファイルを後からGitHubに追加します。</p></section></main><script>
'use strict';
const fileEl=document.getElementById('file'), resultsEl=document.getElementById('results'), statusEl=document.getElementById('status'), confirmEl=document.getElementById('confirm'), exportEl=document.getElementById('export');
let data=null; const selections={};
function update(){const count=Object.keys(selections).length;exportEl.disabled=!count||!confirmEl.checked;statusEl.textContent=data?`読み込み成功：${Object.keys(data.results).length}施設、${count}施設を選択中`:'JSONファイルを選択してください。';}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function show(){resultsEl.replaceChildren();Object.keys(selections).forEach(k=>delete selections[k]);for(const [place,items] of Object.entries(data.results)){const sec=el('section');sec.append(el('h2',`${place}（${items.length}件）`));const grid=el('div',undefined,'grid');items.forEach((item,i)=>{const card=el('article',undefined,'card');const img=document.createElement('img');img.loading='lazy';img.alt=item.title||'';const u=item.image_url||'';try{const p=new URL(u);if(p.protocol==='https:'&&['thumb.wikimedia.org','upload.wikimedia.org'].includes(p.hostname))img.src=u;}catch{}card.append(img);const body=el('div',undefined,'body');body.append(el('p',item.title||''),el('p',`撮影者：${item.artist||'不明'}`),el('p',`ライセンス：${item.license||'不明'}`),el('p',`解像度：${item.width}×${item.height} / 3:4適性：${item.portrait_ready?'あり':'要確認'}`));const a=el('a','Wikimedia Commonsで確認');a.href=item.description_url||'#';a.target='_blank';a.rel='noopener noreferrer';body.append(a);const label=el('label');const radio=document.createElement('input');radio.type='radio';radio.name=`place-${Object.keys(data.results).indexOf(place)}`;radio.addEventListener('change',()=>{selections[place]=item;grid.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');confirmEl.checked=false;update();});label.append(radio,document.createTextNode(' この写真を選ぶ'));body.append(label);card.append(body);grid.append(card);});sec.append(grid);resultsEl.append(sec);}update();}
fileEl.addEventListener('change',async()=>{data=null;resultsEl.replaceChildren();confirmEl.checked=false;try{const file=fileEl.files[0];if(!file)return update();const parsed=JSON.parse(await file.text());if(parsed.source!=='Wikimedia Commons'||!parsed.results||typeof parsed.results!=='object'||Array.isArray(parsed.results))throw Error('TABEJIの候補JSONではありません');for(const items of Object.values(parsed.results)){if(!Array.isArray(items))throw Error('候補データの形式が不正です');}data=parsed;show();}catch(e){statusEl.textContent=`読み込みエラー：${e.message}`;exportEl.disabled=true;}});
confirmEl.addEventListener('change',update);
exportEl.addEventListener('click',()=>{if(!data||!confirmEl.checked)return;const approved=Object.entries(selections).map(([place,item])=>({place,title:item.title,description_url:item.description_url,original_url:item.original_url,artist:item.artist,license:item.license,license_url:item.license_url,credit:item.credit,width:item.width,height:item.height,portrait_ready:item.portrait_ready,review_status:'manually_approved'}));const output={schema_version:1,source:'Wikimedia Commons',mode:'manual_selection_only',automatic_publication:false,reviewer_confirmed_facility_and_license:true,approved};const blob=new Blob([JSON.stringify(output,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tabeji_approved_images.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);});
</script></body></html>
